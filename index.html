<!DOCTYPE html>
<html lang="th" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6a1a2c" id="metaTheme">
<title>THE LIVING PLUS — ประเมินวงเงินกู้ ธอส.</title>
<script>
  // ตั้งธีมก่อนวาดหน้า กันภาพกะพริบ: 06:00–17:59 = กลางวัน, นอกนั้น = กลางคืน
  (function () {
    var t = null;
    try { t = localStorage.getItem('lp-theme'); } catch (e) {}
    if (t !== 'day' && t !== 'night') {
      var h = new Date().getHours();
      t = (h >= 6 && h < 18) ? 'day' : 'night';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --serif:'Noto Serif Thai', 'Times New Roman', serif;
    --sans:'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  /* ===== กลางวัน: พื้นขาว สลับแดงเลือดหมู ===== */
  :root[data-theme="day"]{
    color-scheme: light;
    --page-a:#f3eae8; --page-b:#e3d6d3;
    --surface:#ffffff;
    --header:#6a1a2c; --header-text:#fff4e9; --header-muted:#f0d6cf; --header-line:rgba(255,244,233,.38);
    --seg-bg:#fff4e9; --seg-fg:#6a1a2c;
    --prog-track:rgba(255,244,233,.22); --prog-fill:#f1cf84;
    --panel:#f8f1ef; --panel-2:#f0e3e0;
    --line:#e6d6d3; --line-strong:#c4a7a2;
    --text:#2b1217; --muted:#5b3f45; --faint:#775a5f;
    --accent:#7a1c32; --accent-hover:#5d1325;
    --btn-bg:#7a1c32; --btn-hover:#5d1325; --btn-text:#ffffff;
    --user-bg:#7a1c32; --user-line:#7a1c32; --user-text:#ffffff;
    --tint:rgba(122,28,50,.09);
    --bar:#7a1c32;
    --input-bg:#ffffff;
    --top-bg:#6a1a2c; --top-line:#6a1a2c; --top-text:#fff4e9; --top-muted:#f0d6cf; --top-accent:#f1cf84; --top-rule:rgba(255,244,233,.28);
    --badge-bg:#f1cf84; --badge-text:#3b0c17;
    --err-text:#a31f17; --err-bg:rgba(163,31,23,.07); --err-line:rgba(163,31,23,.35);
    --shadow:0 30px 70px -30px rgba(60,10,20,.4);
  }
  /* ===== กลางคืน: มืด สบายตา ===== */
  :root[data-theme="night"]{
    color-scheme: dark;
    --page-a:#0c0608; --page-b:#070304;
    --surface:#150c0f;
    --header:#1a0f13; --header-text:#e9dfd3; --header-muted:#bdada3; --header-line:rgba(255,230,215,.26);
    --seg-bg:#d4ae5e; --seg-fg:#1a0b10;
    --prog-track:rgba(255,230,215,.11); --prog-fill:#d4ae5e;
    --panel:#211419; --panel-2:#2b1a21;
    --line:rgba(255,230,215,.11); --line-strong:rgba(255,230,215,.26);
    --text:#e9dfd3; --muted:#bdada3; --faint:#a3938a;
    --accent:#d4ae5e; --accent-hover:#e6c677;
    --btn-bg:#d4ae5e; --btn-hover:#e6c677; --btn-text:#1a0b10;
    --user-bg:rgba(212,174,94,.13); --user-line:rgba(212,174,94,.32); --user-text:#e6c981;
    --tint:rgba(212,174,94,.13);
    --bar:#d4ae5e;
    --input-bg:#0f080b;
    --top-bg:#2b1a21; --top-line:#d4ae5e; --top-text:#e9dfd3; --top-muted:#bdada3; --top-accent:#d4ae5e; --top-rule:rgba(255,230,215,.11);
    --badge-bg:#d4ae5e; --badge-text:#1a0b10;
    --err-text:#ffb4a5; --err-bg:rgba(255,120,100,.1); --err-line:rgba(255,150,130,.35);
    --shadow:0 30px 80px -30px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--sans);
    font-size:16px;
    color:var(--text);
    background:radial-gradient(130% 120% at 50% -10%, var(--page-a) 0%, var(--page-b) 65%);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    transition:background .4s ease;
    -webkit-text-size-adjust:100%;
  }
  button{font-family:inherit;}
  [hidden]{display:none !important;}

  .app{
    width:100%; max-width:480px;
    height:min(840px, calc(100dvh - 40px));
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:var(--shadow);
    transition:background .4s ease, border-color .4s ease;
  }
  @media (max-width:520px){
    body{padding:0;}
    .app{max-width:none; height:100dvh; border-radius:0; border:none;}
  }

  /* ---------- header ---------- */
  .header{
    flex-shrink:0;
    padding:calc(16px + env(safe-area-inset-top)) 18px 0;
    background:var(--header);
    color:var(--header-text);
    border-bottom:1px solid var(--line);
    transition:background .4s ease;
  }
  .brand-row{display:flex; align-items:center; gap:12px; padding-bottom:14px;}
  .brand-text{flex:1; min-width:0;}
  .brand-name{
    font-family:var(--serif);
    font-weight:700; font-size:20px; letter-spacing:.06em; line-height:1.3;
  }
  .brand-sub{font-size:14px; color:var(--header-muted); margin-top:2px; line-height:1.4;}
  .link-btn{
    background:none; border:none; padding:6px 0 0; margin:0;
    color:var(--header-text); font-size:14px; text-decoration:underline; text-underline-offset:3px;
    cursor:pointer; min-height:32px;
  }
  .header :focus-visible{outline-color:var(--header-text);}

  .theme-btn{
    flex-shrink:0;
    display:flex; align-items:center; gap:2px;
    padding:3px;
    border-radius:999px;
    border:1px solid var(--header-line);
    background:transparent;
    color:var(--header-muted);
    cursor:pointer;
  }
  .seg{
    width:36px; height:36px; border-radius:50%;
    display:grid; place-items:center;
    transition:background .25s ease, color .25s ease;
  }
  .seg svg{width:19px; height:19px;}
  :root[data-theme="day"] .seg-sun, :root[data-theme="night"] .seg-moon{background:var(--seg-bg); color:var(--seg-fg);}

  .progress-track{height:3px; background:var(--prog-track); margin:0 -18px;}
  .progress-fill{height:100%; width:0%; background:var(--prog-fill); transition:width .5s ease;}

  /* ---------- thread ---------- */
  .thread{
    flex:1; overflow-y:auto;
    padding:20px 16px 12px;
    display:flex; flex-direction:column; gap:14px;
    scroll-behavior:smooth;
  }
  .thread::-webkit-scrollbar{width:6px;}
  .thread::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:6px;}

  .msg{display:flex; flex-direction:column; max-width:88%; animation:rise .35s ease both;}
  .msg.bot{align-self:flex-start;}
  .msg.user{align-self:flex-end;}
  .msg.wide{max-width:100%; width:100%;}
  @keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}

  .bubble{padding:13px 16px; border-radius:16px; font-size:16px; line-height:1.65; white-space:pre-line;}
  .msg.bot .bubble{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--bar);
    border-top-left-radius:4px;
  }
  .msg.user .bubble{
    background:var(--user-bg);
    border:1px solid var(--user-line);
    border-top-right-radius:4px;
    color:var(--user-text);
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }

  .typing{
    align-self:flex-start; display:flex; gap:5px; padding:15px 16px;
    background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--bar);
    border-radius:16px; border-top-left-radius:4px;
  }
  .typing span{width:7px; height:7px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

  /* ---------- cards / forms ---------- */
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:16px; display:flex; flex-direction:column; gap:14px;
  }
  .card-title{font-family:var(--serif); font-size:17px; font-weight:600; line-height:1.4; color:var(--text);}
  .card-hint{font-size:14px; color:var(--muted); line-height:1.6; margin-top:-8px;}
  .group-label{font-size:14px; font-weight:700; color:var(--accent); letter-spacing:.02em; margin-top:2px;}

  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:15px; font-weight:500;}
  .input-wrap{position:relative;}
  .input-wrap input, .composer input{
    width:100%;
    background:var(--input-bg); color:var(--text);
    border:1px solid var(--line-strong); border-radius:12px;
    font-family:var(--sans); font-size:18px; font-variant-numeric:tabular-nums;
    padding:12px 56px 12px 14px; min-height:50px;
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .input-wrap input:focus, .composer input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--tint);}
  .input-wrap input::placeholder, .composer input::placeholder{color:var(--faint);}
  .input-wrap .unit{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    font-size:14px; color:var(--muted); pointer-events:none;
  }
  .field.err input{border-color:var(--err-text);}
  .field .err-msg{font-size:13.5px; color:var(--err-text);}

  .btn{
    min-height:50px; border-radius:12px; padding:0 20px;
    font-size:16px; font-weight:700; cursor:pointer;
    border:1px solid transparent;
    transition:background .2s ease, border-color .2s ease, transform .15s ease, opacity .2s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--btn-bg); color:var(--btn-text);}
  .btn-primary:hover{background:var(--btn-hover);}
  .btn-ghost{background:transparent; color:var(--text); border-color:var(--line-strong); font-weight:500;}
  .btn-ghost:hover{border-color:var(--accent);}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
  .actions{display:flex; gap:10px;}
  .actions .btn-primary{flex:1;}

  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* choices */
  .choices{display:flex; flex-direction:column; gap:10px;}
  .choice{
    text-align:left; background:var(--surface); color:var(--text);
    border:1.5px solid var(--line-strong); border-radius:14px; padding:13px 16px; cursor:pointer;
    transition:border-color .2s ease, background .2s ease;
  }
  .choice:hover:not(:disabled){border-color:var(--accent); background:var(--tint);}
  .choice .c-label{display:block; font-size:16px; font-weight:600; line-height:1.4;}
  .choice .c-sub{display:block; font-size:14px; color:var(--muted); margin-top:3px; line-height:1.5;}
  .choice:disabled{cursor:default; opacity:.5;}
  .choice.picked{opacity:1; border-color:var(--accent); background:var(--tint);}

  /* upload */
  .dropzone{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center;
    padding:18px 14px; border:1.5px dashed var(--line-strong); border-radius:14px; cursor:pointer;
    background:var(--surface);
    transition:border-color .2s ease, background .2s ease;
  }
  .dropzone:hover, .dropzone:focus-within{border-color:var(--accent); background:var(--tint);}
  .dropzone strong{font-size:16px;}
  .dropzone small{font-size:14px; color:var(--muted); line-height:1.5;}
  .dropzone input{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;}
  .thumbs{display:grid; grid-template-columns:repeat(auto-fill, minmax(72px, 1fr)); gap:8px;}
  .thumb{
    position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden;
    background:var(--input-bg); border:1px solid var(--line);
    display:grid; place-items:center; font-size:13px; color:var(--muted); text-align:center; padding:4px;
  }
  .thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .thumb .x{
    position:absolute; top:3px; right:3px; z-index:2; width:26px; height:26px; border-radius:50%;
    border:none; background:rgba(0,0,0,.7); color:#fff; font-size:16px; line-height:1; cursor:pointer;
  }
  .busy{display:flex; align-items:center; gap:10px; font-size:15px; color:var(--muted);}
  .spinner{
    width:20px; height:20px; border-radius:50%;
    border:2.5px solid var(--line-strong); border-top-color:var(--accent);
    animation:spin .8s linear infinite; flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .note{font-size:14px; color:var(--muted); line-height:1.6;}
  .error-box{
    font-size:15px; color:var(--err-text); background:var(--err-bg);
    border:1px solid var(--err-line); border-radius:10px; padding:10px 12px; line-height:1.55;
  }

  details.acc{border:1px solid var(--line); border-radius:12px; padding:2px 12px; background:var(--input-bg);}
  details.acc summary{cursor:pointer; padding:10px 0; font-size:15px; font-weight:500;}
  .acc-row{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--line); font-size:14.5px;}
  .acc-row .a-name{min-width:0;}
  .acc-row .a-basis{display:block; font-size:13px; color:var(--muted);}
  .acc-row .a-amt{font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap;}

  /* ---------- composer ---------- */
  .composer{
    flex-shrink:0;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:var(--surface);
  }
  .composer-label{font-size:14px; color:var(--muted); margin-bottom:8px; min-height:18px;}
  .composer-row{display:flex; gap:8px;}
  .composer-row .input-wrap{flex:1; min-width:0;}
  .composer-err{font-size:14px; color:var(--err-text); margin-top:6px;}
  .composer-err:empty{display:none;}

  /* ---------- results ---------- */
  .summary{
    display:grid; grid-template-columns:repeat(3, 1fr);
    border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--panel);
  }
  .summary > div{padding:11px 8px; text-align:center; border-left:1px solid var(--line);}
  .summary > div:first-child{border-left:none;}
  .summary .s-label{display:block; font-size:13px; color:var(--muted); line-height:1.35;}
  .summary .s-val{display:block; font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:3px;}
  .summary .s-val.hl{color:var(--accent);}
  .summary .s-unit{display:block; font-size:13px; color:var(--muted); margin-top:1px;}

  .programs{display:flex; flex-direction:column; gap:12px; width:100%;}
  .program{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:15px 16px 16px;
  }
  .program.top{
    background:var(--top-bg); border-color:var(--top-line); color:var(--top-text);
    box-shadow:0 0 0 1px var(--top-line) inset;
  }
  .p-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .p-name{font-size:18px; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .badge{
    font-size:12.5px; font-weight:700; letter-spacing:.02em;
    background:var(--badge-bg); color:var(--badge-text); padding:3px 10px; border-radius:999px;
  }
  .p-rate{
    font-size:14px; font-weight:600; color:var(--muted);
    border:1px solid var(--line-strong); border-radius:999px; padding:2px 10px; font-variant-numeric:tabular-nums;
  }
  .p-amount{
    font-family:var(--serif); font-size:32px; font-weight:700; line-height:1.25;
    color:var(--accent); margin:8px 0 2px; font-variant-numeric:tabular-nums;
  }
  .p-amount small{font-family:var(--sans); font-size:15px; font-weight:500; color:var(--muted); margin-left:6px;}
  .p-term{font-size:15px; color:var(--muted); margin-top:6px; padding-top:9px; border-top:1px solid var(--line);}
  .p-term b{color:var(--text); font-size:17px; font-variant-numeric:tabular-nums;}
  .meter{height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:12px;}
  .meter i{display:block; height:100%; width:0%; background:var(--accent); transition:width 1s cubic-bezier(.16,1,.3,1);}

  .program.top .p-rate{color:var(--top-muted); border-color:var(--top-rule);}
  .program.top .p-amount{color:var(--top-accent);}
  .program.top .p-amount small{color:var(--top-muted);}
  .program.top .p-term{color:var(--top-muted); border-top-color:var(--top-rule);}
  .program.top .p-term b{color:var(--top-text);}
  .program.top .meter{background:var(--top-rule);}
  .program.top .meter i{background:var(--top-accent);}

  .footnote{font-size:14px; color:var(--muted); line-height:1.65;}

  /* ---------- login / loading ---------- */
  .view-login, .view-loading{display:none; flex:1; overflow-y:auto;}
  .app[data-view="loading"] .view-loading{display:flex; align-items:center; justify-content:center; gap:12px; color:var(--muted); font-size:16px;}
  .app[data-view="login"] .view-login{display:flex; flex-direction:column; justify-content:center; padding:28px 22px;}
  .app[data-view="login"] .thread, .app[data-view="login"] .composer,
  .app[data-view="loading"] .thread, .app[data-view="loading"] .composer{display:none !important;}
  .login-card{display:flex; flex-direction:column; gap:16px; width:100%;}
  .login-title{font-family:var(--serif); font-size:28px; font-weight:700; margin:0; line-height:1.3;}
  .login-sub{font-size:15.5px; color:var(--muted); line-height:1.6; margin:-6px 0 4px;}
  .pw-toggle{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--accent); font-size:14.5px; font-weight:600;
    padding:10px 10px; cursor:pointer; border-radius:8px;
  }
  .login-card .input-wrap input{padding-right:72px;}
  .login-note{font-size:14px; color:var(--muted); line-height:1.6; text-align:center;}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important; scroll-behavior:auto !important;}
  }
.result-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.result-actions .btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div class="app" id="app" data-view="loading">
  <header class="header">
    <div class="brand-row">
      <div class="brand-text">
        <div class="brand-name">THE LIVING PLUS</div>
        <div class="brand-sub">ประเมินวงเงินกู้ ธอส. เบื้องต้น</div>
        <button class="link-btn" id="logoutBtn" type="button" hidden>ออกจากระบบ</button>
      </div>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="สลับโหมดกลางวัน / กลางคืน" title="สลับโหมดกลางวัน / กลางคืน">
        <span class="seg seg-sun">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
        <span class="seg seg-moon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </span>
      </button>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </header>

  <section class="view-loading" id="viewLoading" aria-live="polite">
    <div class="spinner"></div><span>กำลังตรวจสอบสิทธิ์...</span>
  </section>

  <section class="view-login" id="viewLogin">
    <form class="login-card" id="loginForm" autocomplete="on" novalidate>
      <h1 class="login-title">เข้าสู่ระบบ</h1>
      <p class="login-sub">สำหรับผู้ที่ได้รับสิทธิ์ใช้งาน กรอกชื่อผู้ใช้และรหัสผ่านที่ได้รับจากผู้ดูแลระบบ</p>
      <div class="field" id="fUser">
        <label for="loginUser">ชื่อผู้ใช้</label>

/* =====================================================================
   ตรรกะคำนวณ (ตรงกับสูตรใน Excel)
   ===================================================================== */
function loanTermYears(age){
  if (age < CONFIG.MIN_AGE) return { error:'อายุต่ำกว่าเกณฑ์' };
  if (age >= CONFIG.MAX_AGE) return { error:'อายุเกินเกณฑ์' };
  return { years: age < 30 ? 40 : (CONFIG.MAX_AGE - age) };
}
function pv(monthlyRate, nper, pmt){
  if (monthlyRate === 0) return pmt * nper;
  return pmt * (1 - Math.pow(1 + monthlyRate, -nper)) / monthlyRate;
}
function evaluate(a){
  const term = loanTermYears(a.age);
  if (term.error) return { error: term.error };
  const otherIncome = a.ot + a.commission + a.shift + a.position + a.prof;
  const totalIncome = a.base + otherIncome;
  const debt = a.debtSlip + a.debtSystem;
  const remaining = totalIncome - debt;
  if (remaining <= 0) return { error:'รายได้คงเหลือหลังหักภาระเป็นศูนย์หรือติดลบ จึงยังประเมินวงเงินกู้ไม่ได้ในตอนนี้' };

  const incHalf  = remaining / 2;
  // หาร 2 เมื่อ "ฐานเงินเดือน > 20,000" และ "คงเหลือหลังหักภาระ > 20,000" พร้อมกัน ไม่งั้นหาร 3
  const incOther = (a.base > 20000 && remaining > 20000) ? remaining / 2 : remaining / 3;
  const ctx = { remaining, hasWelfare: !!a.welfare };

  const list = PROGRAMS
    .filter(p => p.enabled !== false)
    .filter(p => !p.show || p.show(ctx))
    .map(p => {
      const inc = p.income === 'half' ? incHalf : incOther;
      // incomeUsed = "รายได้คำนวน" ที่ใช้เป็นตัวตั้งใน PV (ไม่ใช่ค่างวดจริง จึงไม่แสดงให้ลูกค้า)
      return { id:p.id, name:p.name, rate:p.rate, years:term.years,
               incomeUsed: inc,
               amount: Math.max(0, pv(p.rate/12, term.years*12, inc)) };
    })
    .sort((x,y) => y.amount - x.amount);

  return { years: term.years, totalIncome, debt, remaining, programs: list };
}

function parseNum(s){
  const v = parseFloat(String(s).replace(/[^0-9.]/g, ''));
  return isFinite(v) ? v : NaN;
}
function num(v){
  const n = Number(String(v == null ? '' : v).replace(/,/g, ''));
  return isFinite(n) && n > 0 ? n : 0;
}
function el(tag, cls, text){

}
function bindMoney(inp){

    if (isFinite(v)) inp.value = fmt(v);
  });
  inp.addEventListener('input', () => { inp.value = inp.value.replace(/[^0-9.,]/g, ''); });
}

let epoch = 0; // เพิ่มทุกครั้งที่เริ่มใหม่/ออกจากระบบ — งานเก่าที่ค้างอยู่จะไม่ทำอะไรต่อ

skipBtn.addEventListener('click', () => composerHandler && composerHandler('skip'));

function askNumber({ unit = 'บาท', skippable = false, skipLabel = 'ไม่มี', validate, placeholder = 'พิมพ์ตัวเลข' }){

/* ---------- อัปโหลด + เรียก AI ---------- */
function userError(msg){ const e = new Error(msg); e.user = true; return e; }

function toBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(userError('อ่านไฟล์ไม่ได้'));
    r.readAsDataURL(file);
  });
}
async function compressImage(file, maxSide = 1800, quality = 0.85){
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch (e) {
    bmp = await new Promise((res, rej) => {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = () => rej(userError('เปิดรูปภาพไม่ได้ ลองใช้ไฟล์ JPG หรือ PNG'));
      img.src = url;
    });
  }
  const w = bmp.width, h = bmp.height, k = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', quality).split(',')[1];
}
async function filePayload(file){
  if (file.type === 'application/pdf'){
    if (file.size > 8 * 1024 * 1024) throw userError(`ไฟล์ ${file.name} ใหญ่เกิน 8 MB`);
    return { type:'pdf', media_type:'application/pdf', data: await toBase64(file) };
  }
  if (file.type.startsWith('image/')){
    return { type:'image', media_type:'image/jpeg', data: await compressImage(file) };
  }
  throw userError('รองรับเฉพาะรูปภาพ (JPG/PNG) และไฟล์ PDF');
}
async function callAI(task, files){
  if (!CONFIG.AI_ENDPOINT) throw new Error('NO_ENDPOINT');
  const headers = { 'Content-Type':'application/json' };
  if (AUTH.getToken) headers.Authorization = 'Bearer ' + await AUTH.getToken();
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 120000);
  try {
    const res = await fetch(CONFIG.AI_ENDPOINT, {
      method:'POST', headers, body: JSON.stringify({ task, files }), signal: ctl.signal,
    });
    if (res.status === 401 || res.status === 403) throw new Error('UNAUTHORIZED');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'อ่านเอกสารไม่สำเร็จ');
    return j.data;
  } finally { clearTimeout(timer); }
}

function askUpload({ title, hint, accept, maxFiles, task, skipLabel, dropTitle, dropSub }){
  return new Promise(resolve => {
    const e = epoch;
    const card = el('div', 'card');
    card.appendChild(el('div', 'card-title', title));
    card.appendChild(el('div', 'card-hint', hint));

    const drop = el('label', 'dropzone');
    drop.appendChild(el('strong', null, dropTitle));
    drop.appendChild(el('small', null, dropSub));
    const fi = el('input'); fi.type = 'file'; fi.multiple = true; fi.accept = accept;
    drop.appendChild(fi); card.appendChild(drop);

    const thumbs = el('div', 'thumbs'); thumbs.hidden = true; card.appendChild(thumbs);
    const msgBox = el('div'); card.appendChild(msgBox);
    const actions = el('div', 'actions');
    const skip = el('button', 'btn btn-ghost', skipLabel); skip.type = 'button';
    const read = el('button', 'btn btn-primary', 'อ่านเอกสาร'); read.type = 'button'; read.disabled = true;
    actions.appendChild(skip); actions.appendChild(read); card.appendChild(actions);
    card.appendChild(el('div', 'note', 'ไฟล์ถูกส่งไปอ่านเพื่อการประเมินครั้งนี้เท่านั้น ไม่มีการบันทึกเก็บไว้ในระบบนี้'));
    wideMsg(card);

    let files = []; let busy = false; const urls = [];
    function showMsg(node){ msgBox.replaceChildren(); if (node) msgBox.appendChild(node); }
    function renderThumbs(){
      thumbs.replaceChildren(); thumbs.hidden = files.length === 0;
      files.forEach((f, i) => {
        const t = el('div', 'thumb');
        if (f.type.startsWith('image/')){
          const u = URL.createObjectURL(f); urls.push(u);
          const im = el('img'); im.src = u; im.alt = f.name; t.appendChild(im);
        } else { t.textContent = 'PDF'; }
        const x = el('button', 'x', '×'); x.type = 'button'; x.setAttribute('aria-label', 'เอาไฟล์นี้ออก');
        x.addEventListener('click', () => { if (busy) return; files.splice(i, 1); renderThumbs(); });
        t.appendChild(x); thumbs.appendChild(t);
      });
      read.disabled = files.length === 0 || busy;
    }
    fi.addEventListener('change', () => {
      const picked = Array.from(fi.files || []); fi.value = '';
      let msg = '';
      picked.forEach(f => {
        if (files.length >= maxFiles){ msg = `เลือกได้สูงสุด ${maxFiles} ไฟล์`; return; }
        if (!(f.type.startsWith('image/') || f.type === 'application/pdf')){ msg = 'รองรับเฉพาะรูปภาพและ PDF'; return; }
        files.push(f);
      });
      renderThumbs();
      showMsg(msg ? el('div', 'error-box', msg) : null);
    });

    function done(value, label){
      urls.forEach(u => URL.revokeObjectURL(u));
      lockCard(card); userSay(label); resolve(value);
    }
    skip.addEventListener('click', () => { if (!busy) done(null, skipLabel); });
    read.addEventListener('click', async () => {
      if (busy || !files.length) return;
      busy = true; read.disabled = true; skip.disabled = true; fi.disabled = true;
      const b = el('div', 'busy'); b.appendChild(el('div', 'spinner')); b.appendChild(el('span', null, 'กำลังอ่านเอกสาร อาจใช้เวลาครู่หนึ่ง...'));
      showMsg(b);
      try {
        const payloads = await Promise.all(files.map(filePayload));
        const data = await callAI(task, payloads);
        if (e !== epoch) return;
        done(data, `อัปโหลด ${files.length} ไฟล์`);
      } catch (err){
        if (e !== epoch) return;
        busy = false; skip.disabled = false; fi.disabled = false; read.disabled = files.length === 0;
        let m = 'อ่านเอกสารไม่สำเร็จ ลองอีกครั้ง หรือกดข้ามเพื่อกรอกข้อมูลเอง';
        if (err && err.message === 'NO_ENDPOINT') m = 'ระบบอ่านเอกสารยังไม่เปิดใช้งาน กดข้ามเพื่อกรอกข้อมูลเองได้เลย';
        else if (err && err.message === 'UNAUTHORIZED') m = 'สิทธิ์การใช้งานหมดอายุหรือไม่ได้รับอนุญาต กรุณาออกจากระบบแล้วเข้าสู่ระบบใหม่';
        else if (err && err.user) m = err.message;
        else if (err && err.name === 'AbortError') m = 'ใช้เวลานานเกินไป ลองลดจำนวนไฟล์ หรือกดข้ามเพื่อกรอกเอง';
        showMsg(el('div', 'error-box', m));
      }
    });
  });
}

/* ---------- สรุปผลที่ AI อ่านได้ ---------- */
function aggregateSlips(data){
  const months = (data && Array.isArray(data.months) ? data.months : []).filter(m => m && typeof m === 'object');
  const seen = new Map();
  months.forEach((m, i) => { const k = m.period || ('x' + i); if (!seen.has(k)) seen.set(k, m); });
  const list = [...seen.values()];
  if (!list.length) return null;
  const avg = key => Math.round(list.reduce((s, m) => s + num(m[key]), 0) / list.length);
  const r = {
    count: list.length,
    base: avg('base_salary'), ot: avg('overtime'), commission: avg('commission'),
    shift: avg('shift_allowance'), position: avg('position_allowance'), prof: avg('professional_allowance'),
    debtSlip: avg('total_deductions'),
  };
  return (r.base || r.ot || r.commission || r.shift || r.position || r.prof) ? r : null;
}
function aggregateBureau(data){
  const raw = data && Array.isArray(data.accounts) ? data.accounts : [];
  const accounts = raw.filter(a => a && typeof a === 'object').map(a => {
    const inst = num(a.monthly_installment), bal = num(a.outstanding_balance);
    let monthly = 0, basis = '';
    if (inst > 0){ monthly = inst; basis = 'ยอดผ่อนต่อเดือนตามรายงาน'; }
    else if (bal > 0){ monthly = bal * CONFIG.BUREAU_RATE; basis = `ไม่มียอดผ่อน คิด ${Math.round(CONFIG.BUREAU_RATE * 100)}% ของเงินต้นคงเหลือ ${fmt(bal)}`; }
    return { name: String(a.creditor || a.account_type || 'บัญชี').slice(0, 60), monthly: Math.round(monthly), basis };
  }).filter(a => a.monthly > 0);
  if (!accounts.length) return null;
  return { accounts, total: accounts.reduce((s, a) => s + a.monthly, 0) };
}

/* ---------- ตรวจทานก่อนคำนวณ ---------- */
const REVIEW_FIELDS = {
  income: [
    { key:'base', label:'ฐานเงินเดือน' }, { key:'ot', label:'โอที' }, { key:'commission', label:'ค่าคอมมิชชั่น' },
    { key:'shift', label:'ค่ากะ' }, { key:'position', label:'ค่าตำแหน่ง' }, { key:'prof', label:'ค่าวิชาชีพ' },
  ],
  debt: [
    { key:'debtSlip', label:'รายการหักในสลิป (รวมทุกรายการ)' }, { key:'debtSystem', label:'ภาระในระบบเครดิตบูโร' },
  ],
};
function askReview({ values, bureau, bothDocs }){
  return new Promise(resolve => {
    const card = el('div', 'card');
    card.appendChild(el('div', 'card-title', 'ตรวจสอบข้อมูลที่อ่านได้'));
    card.appendChild(el('div', 'card-hint', 'ตัวเลขเป็นค่าเฉลี่ยต่อเดือน แก้ไขได้ถ้าไม่ตรง'));
    const inputs = {}; const all = [...REVIEW_FIELDS.income, ...REVIEW_FIELDS.debt];
    card.appendChild(el('div', 'group-label', 'รายได้ต่อเดือน'));
    REVIEW_FIELDS.income.forEach(f => { const r = fieldRow(f, values[f.key]); inputs[f.key] = r; card.appendChild(r.row); });
    card.appendChild(el('div', 'group-label', 'ภาระผ่อนต่อเดือน'));
    REVIEW_FIELDS.debt.forEach(f => {
      const r = fieldRow(f, values[f.key]); inputs[f.key] = r; card.appendChild(r.row);
      if (f.key === 'debtSystem' && bureau){
        const d = el('details', 'acc'); d.appendChild(el('summary', null, `ดูรายการที่คำนวณ (${bureau.accounts.length} บัญชี)`));
        bureau.accounts.forEach(a => {
          const row = el('div', 'acc-row'); const left = el('div', 'a-name', a.name);
          left.appendChild(el('span', 'a-basis', a.basis));
          row.appendChild(left); row.appendChild(el('div', 'a-amt', fmt(a.monthly))); d.appendChild(row);
        });
        card.appendChild(d);
      }
    });
    if (bothDocs) card.appendChild(el('div', 'note', 'หากสินเชื่อที่ถูกหักในสลิปเป็นรายการเดียวกับที่อยู่ในเครดิตบูโร ให้เหลือไว้ช่องเดียวเพื่อไม่ให้นับซ้ำ'));
    const ok = el('button', 'btn btn-primary', 'ยืนยันและประเมินวงเงิน'); ok.type = 'button'; card.appendChild(ok);
    wideMsg(card);

    ok.addEventListener('click', () => {
      const out = readFields(all, inputs); if (!out) return;
      if (!(out.base > 0)){
        inputs.base.row.classList.add('err'); inputs.base.err.textContent = 'กรุณาใส่ฐานเงินเดือน'; inputs.base.inp.focus(); return;
      }
      lockCard(card); userSay('ยืนยันข้อมูลแล้ว'); resolve(out);
    });
  });
}

async function uploadFlow(){
  await bot('ส่งได้เลยครับ ข้อมูลที่อ่านได้จะให้ตรวจทานก่อนคำนวณทุกครั้ง');
  const slipsRaw = await askUpload({
    title: 'สลิปเงินเดือน', task: 'payslips', maxFiles: CONFIG.MAX_SLIP_FILES,
    accept: 'image/jpeg,image/png,image/webp,application/pdf',
    hint: `ย้อนหลังไม่เกิน 6 เดือน หรือสูงสุด ${CONFIG.MAX_SLIP_FILES} รูป จะเห็นรายได้และรายการหักชัดเจน`,
    dropTitle: 'เลือกรูปสลิป / ไฟล์ PDF', dropSub: `สูงสุด ${CONFIG.MAX_SLIP_FILES} ไฟล์`, skipLabel: 'ข้าม ไม่มีสลิป',
  });
  setProgress(40);
  let slips = null;
  if (slipsRaw){
    slips = aggregateSlips(slipsRaw);
    await bot(slips ? `อ่านสลิปได้ ${slips.count} เดือนแล้วครับ` : 'อ่านตัวเลขจากสลิปไม่ได้ครับ เดี๋ยวให้กรอกเองในขั้นตอนตรวจทาน');
  }

  const bureauRaw = await askUpload({
    title: 'รายงานเครดิตบูโร', task: 'bureau', maxFiles: CONFIG.MAX_BUREAU_FILES,
    accept: 'image/jpeg,image/png,image/webp,application/pdf',
    hint: 'ไฟล์ PDF ที่ปลดล็อกรหัสแล้ว หรือรูปถ่ายหน้ารายงาน ระบบจะรวมยอดผ่อนต่อเดือนให้',
    dropTitle: 'เลือกไฟล์ PDF / รูปภาพ', dropSub: `สูงสุด ${CONFIG.MAX_BUREAU_FILES} ไฟล์`, skipLabel: 'ข้าม ไม่มีเครดิตบูโร',
  });
  setProgress(60);
  let bureau = null;
  if (bureauRaw){
    bureau = aggregateBureau(bureauRaw);
    await bot(bureau ? `พบบัญชีที่ยังมียอดผ่อน ${bureau.accounts.length} รายการ รวม ${fmt(bureau.total)} บาท/เดือน` : 'ไม่พบบัญชีที่มียอดผ่อนในรายงานครับ');
  }

  if (!slips && !bureau){
    await bot('ไม่เป็นไรครับ กรอกข้อมูลเองได้เลย');
    return null;
  }
  const values = {
    base: slips ? slips.base : 0, ot: slips ? slips.ot : 0, commission: slips ? slips.commission : 0,
    shift: slips ? slips.shift : 0, position: slips ? slips.position : 0, prof: slips ? slips.prof : 0,
    debtSlip: slips ? slips.debtSlip : 0, debtSystem: bureau ? bureau.total : 0,
  };
  return askReview({ values, bureau, bothDocs: !!(slips && bureau && values.debtSlip > 0) });
}

async function manualFlow(A){
  await bot('ฐานเงินเดือนต่อเดือนเท่าไหร่ครับ (ก่อนหักใด ๆ)');
  A.base = await askNumber({ validate: v => v > 0 ? '' : 'กรุณาใส่ฐานเงินเดือน' });
  setProgress(40);

  await bot('มีรายได้อื่น ๆ ที่ปรากฏในสลิปเงินเดือนไหมครับ');
  const o = await askForm({
    title: 'รายได้อื่น ๆ ในสลิปเงินเดือน', hint: 'ใส่ค่าเฉลี่ยต่อเดือน ถ้าไม่มีให้เว้นว่างหรือกด "ไม่มี"',
    fields: [{ key:'ot', label:'โอที' }, { key:'commission', label:'ค่าคอมมิชชั่น' }],
  });
  A.ot = o.ot; A.commission = o.commission;
  setProgress(50);

  await bot('ขออีกชุดหนึ่งครับ ธอส. ไม่นับค่าที่พัก ค่าเดินทาง และค่าอาหาร จึงขอเฉพาะรายการที่นับได้');
  const p = await askForm({
    title: 'เงินเพิ่มประจำ', hint: 'ค่ากะ ค่าตำแหน่ง ค่าวิชาชีพ ต่อเดือน',
    fields: [{ key:'shift', label:'ค่ากะ' }, { key:'position', label:'ค่าตำแหน่ง' }, { key:'prof', label:'ค่าวิชาชีพ' }],
  });
  A.shift = p.shift; A.position = p.position; A.prof = p.prof;
  setProgress(60);

  await bot('รายการหักในสลิปเงินเดือนรวมต่อเดือนเท่าไหร่ครับ นับทุกรายการ เช่น ประกันสังคม ภาษี กองทุน สหกรณ์ กยศ. ผ่อนรถ');
  A.debtSlip = await askNumber({ skippable:true });
  setProgress(70);

  await bot('มีภาระผ่อนอื่นในระบบเครดิตบูโรไหมครับ เช่น บัตรเครดิต สินเชื่อส่วนบุคคล เช่าซื้อ (รวมต่อเดือน)');
  A.debtSystem = await askNumber({ skippable:true });
}

function renderResults(res){
  const frag = el('div'); frag.style.cssText = 'display:flex;flex-direction:column;gap:12px;width:100%;';

  const sum = el('div', 'summary');
  [['รายได้รวม', fmt(res.totalIncome), ''], ['ภาระผ่อน', fmt(res.debt), ''], ['คงเหลือ', fmt(res.remaining), 'hl']].forEach(([k, v, c]) => {
    const d = el('div');
    d.appendChild(el('span', 's-label', k));
    d.appendChild(el('span', 's-val ' + c, v));
    d.appendChild(el('span', 's-unit', 'บาท/เดือน'));
    sum.appendChild(d);
  });
  frag.appendChild(sum);

  const max = res.programs[0].amount;
  const list = el('div', 'programs');
  res.programs.forEach((p, i) => {
    const c = el('div', 'program' + (i === 0 ? ' top' : ''));
    const pct = max > 0 ? (p.amount / max) * 100 : 0;
    c.innerHTML = `
      <div class="p-head">
        <div class="p-name">${p.name}${i === 0 ? '<span class="badge">วงเงินสูงสุด</span>' : ''}</div>
        <div class="p-rate">ดอกเบี้ย ${(p.rate * 100).toFixed(2)}%</div>
      </div>
      <div class="p-amount" data-target="${Math.round(p.amount)}"><small>บาท</small></div>
      <div class="p-term">ระยะเวลากู้ <b>${p.years}</b> ปี</div>
      <div class="meter"><i data-pct="${pct}"></i></div>`;
    list.appendChild(c);
  });
  frag.appendChild(list);
  const w = wideMsg(frag);

  requestAnimationFrame(() => {
    w.querySelectorAll('.meter i').forEach(i => { i.style.width = i.dataset.pct + '%'; });
    w.querySelectorAll('.p-amount').forEach(a => {
      const target = parseInt(a.dataset.target, 10), unit = a.querySelector('small');
      const node = document.createTextNode(fmt(reduceMotion ? target : 0)); a.insertBefore(node, unit);
      if (reduceMotion) return;
      let t0 = null; const dur = 900;
      const tick = ts => {
        if (t0 === null) t0 = ts;
        const p = Math.min(1, (ts - t0) / dur), eased = 1 - Math.pow(1 - p, 3);
        node.nodeValue = fmt(target * eased);
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  });
}

async function main(){
  epoch++;
  thread.replaceChildren(); composer.hidden = true; composerHandler = null; setProgress(5);
  const A = { age:0, base:0, ot:0, commission:0, shift:0, position:0, prof:0, debtSlip:0, debtSystem:0, welfare:false };

  await bot('สวัสดีครับ ผมจะช่วยประเมินวงเงินกู้ ธอส. ให้เบื้องต้น\n\nเริ่มจากอายุของคุณ (ปี) เท่าไหร่ครับ');
  A.age = Math.round(await askNumber({
    unit:'ปี',
    validate: v => v < CONFIG.MIN_AGE ? `อายุต่ำกว่า ${CONFIG.MIN_AGE} ปี ยังไม่เข้าเกณฑ์กู้`
                 : v >= CONFIG.MAX_AGE ? `อายุ ${CONFIG.MAX_AGE} ปีขึ้นไป เกินเกณฑ์กู้` : '',
  }));
  setProgress(20);

  await bot('จะให้ผมช่วยอ่านข้อมูลจากเอกสารไหมครับ หรืออยากกรอกเอง');
  const mode = await askChoice([
    { id:'manual', label:'กรอกข้อมูลเอง', sub:'ตอบคำถามไม่กี่ข้อ' },
    { id:'upload', label:'อัปโหลดสลิป / เครดิตบูโร', sub:'ไม่บังคับ ช่วยให้ตัวเลขใกล้เคียงขึ้น' },
  ]);
  setProgress(30);

  let reviewed = null;
  if (mode === 'upload') reviewed = await uploadFlow();
  if (reviewed) Object.assign(A, reviewed);
  else await manualFlow(A);
  setProgress(85);

  await bot('ที่ทำงานหรือต้นสังกัดของคุณมีสวัสดิการสินเชื่อบ้านกับ ธอส. ไหมครับ');
  const w = await askChoice([
    { id:'yes', label:'มีสวัสดิการ', sub:'เช่น ข้าราชการ รัฐวิสาหกิจ หรือองค์กรที่ทำข้อตกลงกับ ธอส.' },
    { id:'no',  label:'ไม่มี' },
  ]);
  A.welfare = (w === 'yes');

  const res = evaluate(A);
  showTyping(); await sleep(900); hideTyping();
  if (res.error){
    await bot('ประเมินไม่ได้ในตอนนี้ครับ\n' + res.error, 200);
  } else {
    await bot(`เรียบร้อยครับ ระยะเวลากู้สูงสุด ${res.years} ปี นี่คือวงเงินโดยประมาณของแต่ละโปรแกรม เรียงจากวงเงินสูงสุด`, 200);
    renderResults(res);
    const note = el('div', 'footnote', '*เป็นการประเมินเบื้องต้นจากข้อมูลที่ให้ ไม่ใช่วงเงินอนุมัติจริง ผลจริงขึ้นอยู่กับหลักเกณฑ์และการพิจารณาของ ธอส. ในแต่ละช่วงเวลา');
    wideMsg(note);
  }
  setProgress(100);
  const again = el('button', 'btn btn-ghost', 'เริ่มประเมินใหม่'); again.type = 'button';
  again.addEventListener('click', () => main());
  const pmt = el('a', 'btn btn-primary', 'คำนวณเรทผ่อน'); pmt.href = CONFIG.PMT_URL; pmt.target = '_blank'; pmt.rel = 'noopener'; pmt.id = 'pmtBtn';
  const row = el('div', 'result-actions'); row.append(again, pmt);
  wideMsg(row);
}

/* =====================================================================
   ล็อกอิน (Firebase Authentication — ชื่อผู้ใช้ + รหัสผ่าน)
   ===================================================================== */
const AUTH = { signIn:null, signOut:null, getToken:null };
const loginForm = $('#loginForm'), loginUser = $('#loginUser'), loginPass = $('#loginPass');
const loginErr = $('#loginErr'), loginBtn = $('#loginBtn'), pwToggle = $('#pwToggle'), logoutBtn = $('#logoutBtn');
let started = false;

function showView(v){ appEl.setAttribute('data-view', v); }
function showLoginError(msg){ loginErr.textContent = msg; loginErr.hidden = !msg; }
function usernameToEmail(u){
  const s = String(u || '').trim().toLowerCase();
  return s.includes('@') ? s : `${s}@${CONFIG.LOGIN_DOMAIN}`;
}
function authMessage(err){
  const code = err && err.code ? String(err.code) : '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-email|missing-password/.test(code)) return 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
  if (/too-many-requests/.test(code)) return 'ลองผิดหลายครั้งเกินไป กรุณารอสักครู่แล้วลองใหม่';
  if (/user-disabled/.test(code)) return 'บัญชีนี้ถูกปิดการใช้งาน กรุณาติดต่อผู้ดูแลระบบ';
  if (/network-request-failed/.test(code)) return 'เชื่อมต่ออินเทอร์เน็ตไม่ได้ กรุณาตรวจสอบสัญญาณแล้วลองใหม่';
  return 'เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง';
}
function enterChat(){
  showView('chat');
  if (!started){ started = true; main(); }
}
function leaveChat(){
  started = false; epoch++;
  thread.replaceChildren(); composer.hidden = true; composerHandler = null;
  showView('login');
}
function onUser(user){
  if (user){
    logoutBtn.hidden = false;
    enterChat();
  } else {
    logoutBtn.hidden = true;
    leaveChat();
    loginPass.value = '';
  }
}

pwToggle.addEventListener('click', () => {
  const show = loginPass.type === 'password';
  loginPass.type = show ? 'text' : 'password';
  pwToggle.textContent = show ? 'ซ่อน' : 'แสดง';
});
loginForm.addEventListener('submit', async ev => {
  ev.preventDefault();
  showLoginError('');
  if (!AUTH.signIn){ location.reload(); return; }
  const u = loginUser.value.trim(), p = loginPass.value;
  if (!u || !p){ showLoginError('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'); return; }
  if (!/^[a-z0-9._@-]+$/i.test(u)){ showLoginError('ชื่อผู้ใช้ใช้ได้เฉพาะตัวอักษรภาษาอังกฤษ ตัวเลข และ . _ -'); return; }
  loginBtn.disabled = true; loginBtn.textContent = 'กำลังเข้าสู่ระบบ...';
  try {
    await AUTH.signIn(usernameToEmail(u), p);
  } catch (err){
    showLoginError(authMessage(err));
  } finally {
    loginBtn.disabled = false; loginBtn.textContent = 'เข้าสู่ระบบ';
  }
});
logoutBtn.addEventListener('click', async () => {
  try { await AUTH.signOut(); } catch (e) {}
});

async function bootAuth(){
  if (!LOGIN_ENABLED){ showView('chat'); started = true; main(); return; }
  showView('loading');
  try {
    const base = `https://www.gstatic.com/firebasejs/${CONFIG.FIREBASE_SDK_VERSION}`;
    const [appMod, authMod] = await Promise.all([ import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`) ]);
    const fbApp = appMod.initializeApp(CONFIG.FIREBASE);
    const auth = authMod.getAuth(fbApp);
    AUTH.signIn = (email, pw) => authMod.signInWithEmailAndPassword(auth, email, pw);
    AUTH.signOut = () => authMod.signOut(auth);
    AUTH.getToken = async () => auth.currentUser ? auth.currentUser.getIdToken() : '';
    authMod.onAuthStateChanged(auth, onUser);
  } catch (e){
    showView('login');
    showLoginError('โหลดระบบล็อกอินไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
    loginBtn.textContent = 'โหลดใหม่';
  }
}

/* =====================================================================
   ธีมกลางวัน/กลางคืน
   ===================================================================== */
const root = document.documentElement;
const themeBtn = $('#themeBtn'), metaTheme = $('#metaTheme');
function applyTheme(t){
  root.setAttribute('data-theme', t);
  const label = t === 'day' ? 'โหมดกลางวัน แตะเพื่อเปลี่ยนเป็นกลางคืน' : 'โหมดกลางคืน แตะเพื่อเปลี่ยนเป็นกลางวัน';
  themeBtn.setAttribute('aria-label', label); themeBtn.title = label;
  metaTheme.setAttribute('content', t === 'day' ? '#6a1a2c' : '#1a0f13');
}
function autoTheme(){ const h = new Date().getHours(); return (h >= 6 && h < 18) ? 'day' : 'night'; }
let manualTheme = null;
try { const s = localStorage.getItem('lp-theme'); if (s === 'day' || s === 'night') manualTheme = s; } catch (e) {}
applyTheme(manualTheme || autoTheme());
themeBtn.addEventListener('click', () => {
  manualTheme = root.getAttribute('data-theme') === 'day' ? 'night' : 'day';
  applyTheme(manualTheme);
  try { localStorage.setItem('lp-theme', manualTheme); } catch (e) {}
});
setInterval(() => { if (!manualTheme) applyTheme(autoTheme()); }, 60000);

bootAuth();
</script>
